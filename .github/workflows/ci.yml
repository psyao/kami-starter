name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo, gd
          coverage: none

      - name: Install dependencies
        id: install
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate

      # Each check runs once the environment is ready, so one push reports every failure.
      - name: Pint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/pint --test

      - name: Larastan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Rector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/rector --dry-run --no-progress-bar

      # ArchTest, and kami:install on this project up to the admin login page.
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: php artisan test --ci

  assets:
    name: Front assets (Vite, Tailwind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # .npmrc sets ignore-scripts: no dependency runs code at install.
      - run: npm ci --no-fund

      - run: npm run build

      # The server never runs Node: a deploy ships this build with the code.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: public/build
          if-no-files-found: error
